[project]
name = "safe-mcp-auditor"
version = "0.0.0"
description = "Offline-first CLI to audit MCP repositories against SAFE-MCP and produce deterministic reports."
authors = [
    { name = "Damien Storm", email = "damien.r.storm@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.5",
    "typer>=0.20.0",
]

[project.scripts]
safe-mcp-auditor = "safe_mcp_auditor.cli:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=9.0.2",
    "python-semantic-release>=10.0.0,<11.0.0",
    "ruff>=0.12.5",
]
