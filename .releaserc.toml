# See https://python-semantic-release.readthedocs.io/

[semantic_release]
tag_format = "v{version}"
allow_zero_version = true

# Stamp the new version into project metadata
# (TOML-aware replacement is preferred for pyproject.toml)
version_toml = ["pyproject.toml:project.version"]

# Always include the lockfile in the release commit
assets = ["uv.lock"]

# Commit message for release commits - includes [skip ci] to prevent CI from running
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"

# Keep uv.lock in sync with the stamped version, then build
build_command = "uv lock && uv build"

[semantic_release.changelog]
[semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[semantic_release.branches]
main = { match = "main" }

[semantic_release.remote]
token = { env = "GH_TOKEN" }
